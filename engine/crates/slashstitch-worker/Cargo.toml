[package]
name = "slashstitch-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp", "rayon"] }
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slashstitch-core = { path = "../slashstitch-core" }
slashstitch-gpu = { path = "../slashstitch-gpu" }
tempfile = "3"
