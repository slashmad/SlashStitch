name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm ci
      - run: npm run typecheck
      - run: cargo fmt --manifest-path engine/Cargo.toml --all --check
      - run: cargo clippy --manifest-path engine/Cargo.toml --all-targets -- -D warnings
      - run: npm test
      - if: runner.os == 'Linux'
        run: |
          cargo install cargo-zigbuild --version 0.24.1 --locked
          python3 -m pip install ziglang==0.17.1
          python3 -c 'import pathlib,ziglang;print(pathlib.Path(ziglang.__file__).parent)' >> "$GITHUB_PATH"
      - run: npm run build
      - run: npm run stage:engine
      - run: npm run build:notices
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y weston
          node scripts/smoke.mjs
          node scripts/regression-smoke.mjs
      - run: npm audit --audit-level=moderate
