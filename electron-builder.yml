appId: com.slashmad.slashstitch
productName: SlashStitch
executableName: slashstitch
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: build/bin
    to: bin
  - from: build/notices
    to: licenses
linux:
  category: Graphics
  icon: build/icons
  target: [AppImage, deb, rpm]
  executableArgs: ["--ozone-platform-hint=auto"]
  maintainer: slashmad
  synopsis: Open-source panorama stitcher powered by Rust & Lensfun
deb:
  depends: ["libgtk-3-0 | libgtk-3-0t64", "libnss3", "libxss1", "libasound2 | libasound2t64"]
rpm:
  depends: ["gtk3", "nss", "libXScrnSaver", "alsa-lib"]
appImage:
  artifactName: SlashStitch-${version}-${arch}.AppImage
win:
  icon: build/icon.ico
  target: [nsis, portable, zip]
  artifactName: SlashStitch-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: SlashStitch-Setup-${version}.exe
portable:
  artifactName: SlashStitch-Portable-${version}.exe
mac:
  icon: build/icon.png
  category: public.app-category.photography
  target: [dmg, zip]
  artifactName: SlashStitch-${version}-mac-${arch}.${ext}
