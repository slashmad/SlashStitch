appId: com.slashmad.slashstitch
productName: SlashStitch
executableName: slashstitch
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  - from: LICENSE
    to: LICENSE
  - from: build/bin
    to: bin
  - from: build/notices
    to: licenses
linux:
  category: Graphics
  icon: build/icons
  target: [AppImage, deb, rpm]
  executableArgs: ["--ozone-platform-hint=auto"]
  maintainer: slashmad
  synopsis: Open-source panorama stitcher powered by Rust & Lensfun
deb:
  artifactName: SlashStitch-${version}-linux-${env.SLASHSTITCH_ARCH}.deb
  depends: ["libgtk-3-0 | libgtk-3-0t64", "libnss3", "libxss1", "libasound2 | libasound2t64"]
rpm:
  artifactName: SlashStitch-${version}-linux-${env.SLASHSTITCH_ARCH}.rpm
  depends: ["gtk3", "nss", "libXScrnSaver", "alsa-lib"]
appImage:
  artifactName: SlashStitch-${version}-linux-${env.SLASHSTITCH_ARCH}.AppImage
win:
  icon: build/icon.ico
  target: [nsis, portable, zip]
  artifactName: SlashStitch-${version}-win-${env.SLASHSTITCH_ARCH}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: SlashStitch-${version}-win-${env.SLASHSTITCH_ARCH}-setup.exe
portable:
  artifactName: SlashStitch-${version}-win-${env.SLASHSTITCH_ARCH}-portable.exe
mac:
  icon: build/icon.icns
  category: public.app-category.photography
  target: [dmg, zip]
  artifactName: SlashStitch-${version}-mac-${env.SLASHSTITCH_ARCH}.${ext}
